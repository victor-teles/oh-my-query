name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-version:
    name: Bump version from tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version in config files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' apps/web/src-tauri/tauri.conf.json > tmp.json && mv tmp.json apps/web/src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" apps/web/src-tauri/Cargo.toml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/src-tauri/tauri.conf.json apps/web/src-tauri/Cargo.toml
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump version to ${GITHUB_REF_NAME#v}"
          git push origin main

  build-macos:
    name: Build macOS (${{ matrix.label }})
    needs: bump-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/web/src-tauri -> target"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/web
          tagName: ${{ github.ref_name }}
          releaseName: "oh-my-query ${{ github.ref_name }}"
          releaseBody: "See assets below to download. Install via Homebrew: `brew install --cask victor-teles/tap/oh-my-query`"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download DMGs and compute SHA256
        id: hashes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/victor-teles/oh-my-query/releases/download/${{ github.ref_name }}"

          curl -sL "${BASE}/oh-my-query_${VERSION}_aarch64.dmg" -o arm64.dmg
          curl -sL "${BASE}/oh-my-query_${VERSION}_x64.dmg" -o x64.dmg

          echo "aarch64_sha=$(shasum -a 256 arm64.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "x64_sha=$(shasum -a 256 x64.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Dispatch tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: victor-teles/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "aarch64_sha": "${{ steps.hashes.outputs.aarch64_sha }}",
              "x64_sha": "${{ steps.hashes.outputs.x64_sha }}"
            }
