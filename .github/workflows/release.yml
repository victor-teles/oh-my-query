name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-channel:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.parse.outputs.channel }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
            PRERELEASE="false"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
          else
            echo "::error::Tag ${TAG} does not match v<X>.<Y>.<Z> (stable) or v<X>.<Y>.<Z>-beta.<N> (beta)"
            exit 1
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  bump-version:
    name: Bump version from tag
    needs: resolve-channel
    if: needs.resolve-channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version in electrobun.config.ts
        run: |
          VERSION="${{ needs.resolve-channel.outputs.version }}"
          sed -i "s/version: \"[^\"]*\"/version: \"$VERSION\"/" apps/app/electrobun.config.ts

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/app/electrobun.config.ts
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump version to ${{ needs.resolve-channel.outputs.version }}"
          git push origin main

  build-macos:
    name: Build macOS (${{ matrix.label }}) [${{ needs.resolve-channel.outputs.channel }}]
    needs: [resolve-channel, bump-version]
    if: always() && needs.resolve-channel.result == 'success' && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: arm64
            tauri-arch: aarch64
          - arch: x64
            label: x64
            tauri-arch: x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-channel.outputs.channel == 'stable' && 'main' || github.ref }}

      - name: Stamp beta version
        if: needs.resolve-channel.outputs.channel == 'beta'
        run: |
          VERSION="${{ needs.resolve-channel.outputs.version }}"
          sed -i '' "s/version: \"[^\"]*\"/version: \"$VERSION\"/" apps/app/electrobun.config.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

      - name: Build Electrobun app
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_PASSWORD }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run --cwd apps/app desktop:build

      - name: Rename and upload artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-channel.outputs.version }}
          ARCH_LABEL: ${{ matrix.tauri-arch }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SRC="apps/app/build/stable-macos-${BUILD_ARCH}/oh-my-query.dmg"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected DMG not found at $SRC"
            ls -la apps/app/build/ || true
            exit 1
          fi
          DEST="oh_my_query_${VERSION}_${ARCH_LABEL}.dmg"
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber

  build-windows:
    name: Build Windows (${{ matrix.label }}) [${{ needs.resolve-channel.outputs.channel }}]
    needs: [resolve-channel, bump-version]
    if: always() && needs.resolve-channel.result == 'success' && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: x64
          - arch: arm64
            label: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-channel.outputs.channel == 'stable' && 'main' || github.ref }}

      - name: Stamp beta version
        if: needs.resolve-channel.outputs.channel == 'beta'
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-channel.outputs.version }}"
          (Get-Content apps/app/electrobun.config.ts) `
            -replace 'version: "[^"]*"', "version: `"$version`"" `
            | Set-Content apps/app/electrobun.config.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Build Electrobun app
        run: bun run --cwd apps/app desktop:build

      - name: Note unsigned Windows build
        if: vars.WINDOWS_SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          echo "::warning::Windows artifact is unsigned. Set repo variable WINDOWS_SIGNING_ENABLED=true and add WINDOWS_CERTIFICATE secrets to enable signing."

      - name: Upload Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.resolve-channel.outputs.version }}"
          $label = "${{ matrix.label }}"
          $arch = "${{ matrix.arch }}"
          # Electrobun's Windows build emits a self-extracting zip in apps/app/artifacts/.
          $candidate = Get-ChildItem -Path "apps/app/artifacts" -Filter "stable-win-${arch}-*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candidate) {
            Write-Error "No Electrobun Windows artifact found in apps/app/artifacts/"
            Get-ChildItem -Path "apps/app/artifacts" -ErrorAction SilentlyContinue
            exit 1
          }
          $dest = "oh_my_query_${version}_${label}_setup.zip"
          Copy-Item $candidate.FullName $dest
          gh release upload "${{ github.ref_name }}" $dest --clobber

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [resolve-channel, build-macos]
    if: needs.resolve-channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${{ needs.resolve-channel.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Download DMGs and compute SHA256
        id: hashes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/victor-teles/oh-my-query/releases/download/${{ github.ref_name }}"

          curl -sL "${BASE}/oh_my_query_${VERSION}_aarch64.dmg" -o arm64.dmg
          curl -sL "${BASE}/oh_my_query_${VERSION}_x64.dmg" -o x64.dmg

          echo "aarch64_sha=$(shasum -a 256 arm64.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "x64_sha=$(shasum -a 256 x64.dmg | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Dispatch tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: victor-teles/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "aarch64_sha": "${{ steps.hashes.outputs.aarch64_sha }}",
              "x64_sha": "${{ steps.hashes.outputs.x64_sha }}"
            }
