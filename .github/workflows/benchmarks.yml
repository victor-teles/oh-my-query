name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src-tauri/**"
      - ".github/workflows/benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/src-tauri/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Rust / CodSpeed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1.5.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          version: 1.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "apps/web/src-tauri -> target"

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd # v2.75.21
        with:
          tool: cargo-codspeed

      - name: Build benchmarks
        working-directory: apps/web/src-tauri
        run: cargo codspeed build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@76578c2a7ddd928664caa737f0e962e3085d4e7c # v3.8.1
        with:
          working-directory: apps/web/src-tauri
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
