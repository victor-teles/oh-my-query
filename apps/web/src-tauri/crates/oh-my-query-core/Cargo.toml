[package]
name = "oh-my-query-core"
version = "0.0.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
sqlx-errors = ["dep:sqlx"]
mongo-errors = ["dep:mongodb"]
redis-errors = ["dep:redis"]
reqwest-errors = ["dep:reqwest"]
duckdb-errors = ["dep:duckdb"]
mssql-errors = ["dep:tiberius", "dep:bb8", "dep:bb8-tiberius"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
async-trait.workspace = true
log.workspace = true
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "6"
polyglot-sql = "0.1"
tauri = { version = "2.10.0" }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
  "runtime-tokio",
  "tls-native-tls",
] }
mongodb = { version = "3", optional = true }
redis = { version = "0.27", optional = true, features = ["tokio-comp", "aio"] }
reqwest = { version = "0.12", optional = true, features = [
  "json",
  "native-tls",
] }
duckdb = { version = "1", optional = true, features = ["bundled"] }
tiberius = { version = "0.12", optional = true, default-features = false, features = [
  "tds73",
  "native-tls",
  "chrono",
] }
bb8 = { version = "0.8", optional = true }
bb8-tiberius = { version = "0.15", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
