[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.83.0"
license = ""
authors = ["victor"]

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
log = "0.4"
thiserror = "1"
anyhow = "1"
urlencoding = "2"
base64 = "0.22"

[package]
name = "oh-my-query"
version = "0.0.10"
description = "A query UI tool"
authors = ["victor"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.83.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
oh-my-query-core = { path = "crates/oh-my-query-core" }
oh-my-query-drivers-pg = { path = "crates/oh-my-query-drivers-pg" }
oh-my-query-drivers-mysql = { path = "crates/oh-my-query-drivers-mysql" }
oh-my-query-drivers-sqlite = { path = "crates/oh-my-query-drivers-sqlite" }
oh-my-query-drivers-mongo = { path = "crates/oh-my-query-drivers-mongo" }
oh-my-query-drivers-redis = { path = "crates/oh-my-query-drivers-redis" }
oh-my-query-drivers-clickhouse = { path = "crates/oh-my-query-drivers-clickhouse" }
oh-my-query-drivers-duckdb = { path = "crates/oh-my-query-drivers-duckdb" }
oh-my-query-drivers-mssql = { path = "crates/oh-my-query-drivers-mssql" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["devtools", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
codspeed-criterion-compat = "2"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "transpile_bench"
harness = false

[[bench]]
name = "explain_parser_bench"
harness = false
