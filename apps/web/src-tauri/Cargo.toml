[package]
name = "oh-my-query"
version = "0.0.10"
description = "A query UI tool"
authors = ["victor"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.83.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["devtools", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "mysql",
  "sqlite",
  "uuid",
  "chrono",
  "json",
] }
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
dirs = "6"
polyglot-sql = "0.1"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
duckdb = { version = "1", features = ["bundled"] }
tiberius = { version = "0.12", default-features = false, features = [
  "tds73",
  "native-tls",
  "chrono",
] }
bb8 = "0.8"
bb8-tiberius = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
codspeed-criterion-compat = "2"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "transpile_bench"
harness = false

[[bench]]
name = "explain_parser_bench"
harness = false
