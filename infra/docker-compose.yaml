services:
  clickhouse:
    image: "clickhouse/clickhouse-server:${CHVER:-latest}"
    user: "101:101"
    container_name: clickhouse
    hostname: clickhouse
    volumes:
      - ./fs/volumes/clickhouse/etc/clickhouse-server/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./fs/volumes/clickhouse/etc/clickhouse-server/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    depends_on:
      - clickhouse-keeper
  clickhouse-keeper:
    image: "clickhouse/clickhouse-keeper:${CHKVER:-latest-alpine}"
    user: "101:101"
    container_name: clickhouse-keeper
    hostname: clickhouse-keeper
    volumes:
      - ./fs/volumes/clickhouse-keeper/etc/clickhouse-keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "127.0.0.1:9181:9181"
  mongodb:
    image: "mongo:${MONGOVER:-8}"
    container_name: mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-omq}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-omq}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-oh_my_query}"
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
  mariadb:
    image: "mariadb:${MARIADBVER:-11}"
    container_name: mariadb
    hostname: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-oh_my_query}"
      MARIADB_USER: "${MARIADB_USER:-omq}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-omq}"
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
  postgres:
    image: "postgres:${PGVER:-16}"
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-omq}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-omq}"
      POSTGRES_DB: "${POSTGRES_DATABASE:-oh_my_query}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./fs/volumes/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

# SQLite is file-based rather than service-based.
# Use ./fs/volumes/sqlite/oh-my-query.sqlite as the database path in the app.
volumes:
  mariadb-data:
  mongodb-data:
  postgres-data:
