pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,css}"
      run: bun x ultracite fix {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,css}"
      run: bun x ultracite check {staged_files}

    - name: check-types
      glob: "{apps,packages}/**/*.{ts,tsx}"
      run: bun run check-types

    # TODO(electrobun-migration): re-enable once renderer test mocks are
    # rebuilt around the Electroview RPC client (currently still expect the
    # old @tauri-apps/api/mocks invoke surface). Tracked separately.
    # - name: test
    #   glob: "{apps,packages}/**/*.{ts,tsx}"
    #   run: bun run --cwd apps/app test
