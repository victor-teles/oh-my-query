pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,css}"
      exclude:
        - ".agents/**"
        - ".claude/**"
      run: bun x ultracite fix {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,css}"
      exclude:
        - ".agents/**"
        - ".claude/**"
      run: bun x ultracite check {staged_files}

    - name: check-types
      glob: "{apps,packages}/**/*.{ts,tsx}"
      run: bun run check-types

    - name: test
      glob: "{apps,packages}/**/*.{ts,tsx}"
      run: bun run --cwd apps/app test
